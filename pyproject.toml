[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pylauncher"
version = "0.1.0"
description = "A from-scratch Minecraft Java Edition launcher supporting offline accounts"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "faisaljs"}]
keywords = ["minecraft", "launcher", "offline"]
dependencies = ["requests>=2.28"]

[project.scripts]
pylauncher = "pylauncher.cli:main"
pylauncher-gui = "pylauncher.gui.app:main"

[project.urls]
Homepage = "https://github.com/faisaljs/PyLauncher"
Issues = "https://github.com/faisaljs/PyLauncher/issues"

[project.optional-dependencies]
dev = ["pytest>=7.4"]
gui = ["PySide6>=6.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["pylauncher*"]